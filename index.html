<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // React Fast Refresh preamble detection guarantees
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;

      // Silence benign dev server HMR websocket notices in sandboxed AI Studio preview
      (function() {
        const isViteNotice = function(arg) {
          if (!arg) return false;
          const str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return typeof str === 'string' && (
            str.includes('[vite]') ||
            str.includes('WebSocket connection to') ||
            str.includes('failed to connect to websocket')
          );
        };
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isViteNotice)) return;
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isViteNotice)) return;
          origWarn.apply(console, args);
        };
        const origLog = console.log;
        console.log = function(...args) {
          if (args.some(isViteNotice)) return;
          origLog.apply(console, args);
        };
        const origDebug = console.debug;
        console.debug = function(...args) {
          if (args.some(isViteNotice)) return;
          origDebug.apply(console, args);
        };
        const origInfo = console.info;
        console.info = function(...args) {
          if (args.some(isViteNotice)) return;
          origInfo.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && isViteNotice(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && isViteNotice(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>QuestLife</title>
    <meta name="description" content="A mobile-first dark fantasy hunter RPG system interface that turns daily life into a game." />

    <meta name="apple-mobile-web-app-title" content="QuestLife" />

    <meta property="og:title" content="QuestLife" />
    <meta property="og:description" content="A mobile-first dark fantasy hunter RPG system interface that turns daily life into a game." />
